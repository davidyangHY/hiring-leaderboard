name: Retry blocked snapshot

# When a scheduled snapshot run fails (e.g. a job board stayed unreachable through
# both retry passes and the validation gate blocked the day), wait 20 minutes and
# run the snapshot again, instead of waiting hours for the backup cron.
#
# Loop guard: this only reacts to *scheduled* runs. The re-run it starts is a
# workflow_dispatch run, so if the re-run also fails, it can't trigger another.

on:
  workflow_run:
    workflows: ["Daily hiring snapshot"]
    types: [completed]

permissions:
  actions: write              # required to start the snapshot workflow

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the outage to clear
        run: sleep 1200

      - name: Re-run the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily-snapshot.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"
          echo "Re-ran the snapshot after a blocked scheduled run: ${{ github.event.workflow_run.html_url }}" \
            >> "$GITHUB_STEP_SUMMARY"
