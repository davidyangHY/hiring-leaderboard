name: hiring_leaderboard
version: "1.0.0"
config-version: 2

profile: hiring_leaderboard

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # A role counts as closed only after it's missing from this many consecutive
  # snapshot days, so a one-day blip on a job board can't close it.
  closed_after_missed_snapshots: 2

models:
  hiring_leaderboard:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
